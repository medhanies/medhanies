[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-engine"
version = "1.0.0"
description = "Rules-based AML transaction monitoring engine: structuring, high-risk jurisdiction, and beneficial-ownership detection on synthetic data, modeled on OFAC/FinCEN/FATF frameworks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Medhanie Solomon" }]
keywords = ["aml", "bsa", "compliance", "transaction-monitoring", "ofac", "fincen", "fatf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
]

# Zero runtime dependencies by design: the engine runs on the Python
# standard library so it can be cloned and executed with no setup.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
aml-engine = "aml_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["aml_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
